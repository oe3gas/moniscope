<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ablagestruktur von MoniScope</title>
<desc>Links das Repo-Verzeichnis mit Katalog, Sessions, Jobs, Protokollen und Konfiguration; rechts die Ablage-Wurzel aus storage_roots.json mit Direktaufnahmen und je Lauf einem longrun-Verzeichnis.</desc>
<rect x="40" y="50" width="290" height="296" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Repo-Verzeichnis</text>
<rect x="56" y="92" width="258" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="70" y="106" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">known_freq/</text>
<text x="70" y="122" dominant-baseline="central" font-size="12" fill="#534AB7">Frequenzkatalog, eine Datei je Dienst</text>
<rect x="56" y="140" width="258" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="70" y="154" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">sessions/</text>
<text x="70" y="170" dominant-baseline="central" font-size="12" fill="#534AB7">session_*.db, Befund-Sidecars</text>
<rect x="56" y="188" width="258" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="70" y="202" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">jobs/</text>
<text x="70" y="218" dominant-baseline="central" font-size="12" fill="#534AB7">index.json, mscan/&lt;ID&gt;.json</text>
<rect x="56" y="236" width="258" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="70" y="250" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">logs/, data/params/</text>
<text x="70" y="266" dominant-baseline="central" font-size="12" fill="#534AB7">Protokolle, Parameter-Memory</text>
<rect x="56" y="284" width="258" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="70" y="298" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Konfiguration und Notizen</text>
<text x="70" y="314" dominant-baseline="central" font-size="12" fill="#534AB7">station.json, *_labels.json</text>
<rect x="360" y="50" width="280" height="296" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Ablage-Wurzel</text>
<rect x="376" y="92" width="248" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="390" y="106" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Direktaufnahmen</text>
<text x="390" y="122" dominant-baseline="central" font-size="12" fill="#0F6E56">*.wav, *.specbin und Sidecars</text>
<rect x="376" y="142" width="248" height="164" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="390" y="160" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">longrun_&lt;Lauf-ID&gt;/</text>
<text x="390" y="176" dominant-baseline="central" font-size="12" fill="#0F6E56">je Lauf ein Verzeichnis</text>
<rect x="392" y="192" width="216" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="404" y="208" dominant-baseline="central" font-size="12" fill="#2C2C2A">job.json</text>
<rect x="392" y="230" width="216" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="404" y="246" dominant-baseline="central" font-size="12" fill="#2C2C2A">Teildateien: .wav, .specbin</text>
<rect x="392" y="268" width="216" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="404" y="284" dominant-baseline="central" font-size="12" fill="#2C2C2A">MSCAN-Segmente: .wav</text>
<text x="40" y="372" font-size="12" fill="#5F5E5A">Ablage-Wurzel = erster Eintrag aus storage_roots.json, im Auslieferungszustand records/ im Repo.</text>
</svg>
